name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - name: Install bats and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq

      # Runs every suite, so that each one's results are printed, and then fails if any failed.
      - name: Run the bats suites
        run: |
          status=0
          for f in tests/*.bats; do
            echo "*** $f ***"
            bats "$f" || status=1
            echo ""
          done
          exit "$status"
